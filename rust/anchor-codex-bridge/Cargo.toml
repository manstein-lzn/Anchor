[package]
name = "anchor-codex-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local Streamable HTTP MCP bridge orchestrating Codex app-server sessions and Git worktrees"

[dependencies]
anchor-file-lease = { path = "../anchor-file-lease" }
anchor-mcp-host = { path = "../anchor-mcp-host" }
axum = "0.8"
http = "1"
jsonschema = { version = "=0.33.0", default-features = false }
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"] }
rustix = { version = "=1.1.5", features = ["process"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
walkdir = "2"
tempfile = "3"

[dev-dependencies]
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
