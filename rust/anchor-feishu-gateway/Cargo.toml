[package]
name = "anchor-feishu-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust-native Feishu application-bot private-message long connection"

[dependencies]
anchor-channel-transport = { path = "../anchor-channel-transport" }
base64 = "0.22"
futures.workspace = true
prost = "=0.14.3"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "sync", "signal"] }
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

[dev-dependencies]
axum = { version = "=0.8.9", features = ["multipart", "ws"] }
md-5 = "0.10"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
rustix = { version = "=1.1.5", features = ["process"] }
tempfile = "=3.27.0"
