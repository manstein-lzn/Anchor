[package]
name = "anchor-docmost-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust-native official Docmost attachment MCP tool"

[dependencies]
rmcp = { workspace = true, features = ["server", "transport-io"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls", "multipart"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-std", "io-util", "net", "sync"] }
thiserror = { workspace = true }
uuid = "1"
percent-encoding = "2"
rustix = { version = "1", features = ["fs"] }
tempfile = "3"
sha2 = { workspace = true }

[dev-dependencies]
axum = "0.8"
