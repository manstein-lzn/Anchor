[workspace]
members = ["anchor-runtime", "anchor-io-harness-runtime", "anchor-sandbox-bwrap", "anchor-mcp-host", "anchor-runner-host", "anchor-graph-host", "anchor-rsi"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
rig-agent = { version = "=0.43.0", default-features = false }
rig-core = { version = "=0.43.0", default-features = false, features = ["reqwest", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
rmcp = { version = "=2.2.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
rig-rmcp = { version = "=0.43.0", default-features = false }
sha2 = "0.10"
