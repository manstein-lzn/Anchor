[workspace]
members = ["anchor-file-lease", "anchor-workspace-files", "anchor-kernel", "anchor-facts", "anchor-hub", "anchor-eval", "anchor-runtime", "anchor-sandbox-bwrap", "anchor-mcp-host", "anchor-runner-host", "anchor-graph-host", "anchor-rsi", "anchor-platform-session", "anchor-wecom-tools", "anchor-docmost-tools", "anchor-network-tools", "anchor-deepseek-tools", "anchor-briefing-tools", "anchor-git-tools", "anchor-devtools", "anchor-scholarly", "anchor-library", "anchor-wecom-gateway", "anchor-distribution"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
rmcp = { version = "=2.2.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "client-side-sse"] }
sha2 = "0.10"

# Tests spend their time in our own code (the scheduler differentials replay
# tens of thousands of seeds). opt-level 1 makes them about 3x faster and keeps
# debug assertions, overflow checks and debuginfo; incremental rebuilds cost
# the same (5 s for a Host change).
[profile.dev]
opt-level = 1

# Content digests (the Host's own executable, artifacts) hash hundreds of
# megabytes; unoptimized, sha2 takes seconds on a debug build.
[profile.dev.package.sha2]
opt-level = 3
