[package]
name = "anchor-deepseek-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Evidence-preserving DeepSeek Search and Fetch MCP tools"

[dependencies]
anchor-workspace-files = { path = "../anchor-workspace-files" }
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
rmcp = { workspace = true, features = ["server", "transport-io"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json"] }
serde = { workspace = true }
serde_json = { workspace = true }
rustix = { version = "=1.1.5", features = ["fs"] }
tempfile = "=3.27.0"
tokio = { workspace = true, features = ["io-std", "io-util", "net"] }

[dev-dependencies]
axum = "=0.8.9"
