[package]
name = "anchor-channel-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Private state, delivery ledger and Host callback primitives for channel transports"

[dependencies]
base64 = "0.22"
md-5 = "0.10"
anchor-file-lease = { path = "../anchor-file-lease" }
futures.workspace = true
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
rustix = { version = "=1.1.5", features = ["fs", "process"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
subtle = "=2.6.1"
tokio = { workspace = true, features = ["net", "io-util", "sync"] }
uuid = { version = "=1.26.1", features = ["v4"] }

[dev-dependencies]
axum = "=0.8.9"
