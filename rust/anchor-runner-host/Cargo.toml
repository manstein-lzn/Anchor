[package]
name = "anchor-runner-host"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Rust-native Graph host with Sandbox, immutable files and paired parallelism"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
tokio-util = { version = "0.7", features = ["io"] }
sha2 = { workspace = true }
shlex = "1"
axum = { version = "0.8", features = ["json"] }
anchor-runtime-rig = { path = "../anchor-runtime" }
anchor-io-harness-runtime = { path = "../anchor-io-harness-runtime" }
anchor-graph-host = { path = "../anchor-graph-host" }
anchor-mcp-host = { path = "../anchor-mcp-host" }
anchor-sandbox-bwrap = { path = "../anchor-sandbox-bwrap" }
rig-agent = { version = "=0.43.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "net", "sync", "fs", "time"] }
tower-http = { version = "0.6", features = ["fs", "limit"] }

[dev-dependencies]
rig-core = { workspace = true, features = ["test-utils"] }
io-harness = { version = "=0.86.0", features = ["media"] }
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "anchor-runner-host"
path = "src/main.rs"
