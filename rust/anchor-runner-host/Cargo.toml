[package]
name = "anchor-runner-host"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Rust-native Graph host with Sandbox, immutable files and paired parallelism"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
sha2 = { workspace = true }
base64 = "0.22"
md-5 = "0.10"
rustix = { version = "1", features = ["fs", "process"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
mime = "0.3"
ipnet = "=2.12.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
shlex = "1"
axum = { version = "0.8", features = ["json"] }
anchor-runtime = { path = "../anchor-runtime" }
anchor-graph-host = { path = "../anchor-graph-host" }
anchor-library = { path = "../anchor-library" }
anchor-mcp-host = { path = "../anchor-mcp-host" }
anchor-sandbox-bwrap = { path = "../anchor-sandbox-bwrap" }
anchor-platform-session = { path = "../anchor-platform-session" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
agent-client-protocol-schema = { version = "=1.9.1", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "net", "sync", "fs", "time", "signal", "process"] }
tower-http = { version = "0.6", features = ["fs", "limit"] }
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server", "elicitation"] }
url = "=2.5.8"
tempfile = "3"

[dev-dependencies]
anchor-distribution = { path = "../anchor-distribution" }
anchor-wecom-gateway = { path = "../anchor-wecom-gateway" }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
tar = { version = "=0.4.46", default-features = false }
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["handshake"] }
tower = { version = "0.5", features = ["util"] }
png = "0.18"

[[bin]]
name = "anchor-runner-host"
path = "src/main.rs"
