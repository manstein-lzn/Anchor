[package]
name = "anchor-rsi"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Read-only native RSI evidence MCP plugin"

[dependencies]
anchor-kernel = { path = "../anchor-kernel" }
anchor-runtime = { path = "../anchor-runtime" }
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
roxmltree = "=0.20.0"
rmcp = { version = "=2.2.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = { version = "=0.4.46", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
tokio-util = "0.7"
toml = "0.8"
walkdir = "2"
zstd = { version = "=0.13.3", default-features = false }

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tempfile = "3"
rmcp = { version = "=2.2.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
