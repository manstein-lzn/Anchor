[package]
name = "anchor-git-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Workspace Git MCP using the deployment's native Git CLI"

[dependencies]
base64 = "=0.22.1"
rmcp = { workspace = true, features = ["server", "transport-io"] }
rustix = { version = "=1.1.5", features = ["process"] }
serde = { workspace = true }
serde_json = { workspace = true }
shlex = "1"
tempfile = "3"
tokio = { workspace = true, features = ["io-std", "io-util", "process", "sync"] }
tokio-util = "0.7"
url = "=2.5.8"

[dev-dependencies]
anchor-graph-host = { path = "../anchor-graph-host" }
