[package]
name = "anchor-mcp-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Host-owned MCP client adapter for Anchor Rust runtime"

[dependencies]
anchor-runtime = { path = "../anchor-runtime" }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rmcp = { workspace = true, features = ["transport-child-process", "reqwest-tls-no-provider", "server", "transport-streamable-http-server"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
http = "1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "process"] }

[dev-dependencies]
tempfile = "3"
axum = "0.8"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net"] }
tokio-util = "0.7"
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
