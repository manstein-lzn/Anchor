[package]
name = "anchor-mcp-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Host-owned MCP client adapter for Anchor Rust runtime"

[dependencies]
rig-core = { workspace = true }
rmcp = { workspace = true }
rig-rmcp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
axum = "0.8"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net"] }
tokio-util = "0.7"
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"] }
