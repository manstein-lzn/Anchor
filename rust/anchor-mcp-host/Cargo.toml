[package]
name = "anchor-mcp-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Host-owned MCP client adapter for Anchor Rust runtime"

[features]
default = []
rig-legacy = ["dep:rig-core", "dep:rig-rmcp", "anchor-runtime-rig/rig-legacy"]

[dependencies]
anchor-runtime-rig = { path = "../anchor-runtime", default-features = false }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rig-core = { workspace = true, optional = true }
rmcp = { workspace = true, features = ["transport-child-process"] }
rig-rmcp = { workspace = true, optional = true }
http = "1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "process"] }

[dev-dependencies]
axum = "0.8"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net"] }
tokio-util = "0.7"
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"] }
