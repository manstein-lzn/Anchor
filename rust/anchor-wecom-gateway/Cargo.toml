[package]
name = "anchor-wecom-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust-native WeCom channel transport adapter"

[dependencies]
aes = "0.8"
base64 = "0.22"
cbc = "0.1"
futures.workspace = true
md-5 = "0.10"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
rustix = { version = "=1.1.5", features = ["fs", "process"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle = "=2.6.1"
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "sync", "signal"] }
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
uuid = { version = "=1.26.1", features = ["v4"] }

[dev-dependencies]
axum = "=0.8.9"
tempfile = "=3.27.0"
