[package]
name = "anchor-distribution"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Source-free Goose Runtime distribution builder"

[dependencies]
anchor-graph-host = { path = "../anchor-graph-host" }
clap = { version = "=4.5.54", features = ["derive"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
object = { version = "=0.40.0", default-features = false, features = ["read_core", "elf", "std"] }
rustix = { version = "=1.1.5", features = ["fs"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng = "=0.10.0"
sha2.workspace = true
tar = { version = "=0.4.46", default-features = false }
tempfile = "=3.27.0"
thiserror.workspace = true
toml = "=0.8.23"
