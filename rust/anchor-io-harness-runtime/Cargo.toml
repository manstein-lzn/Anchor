[package]
name = "anchor-io-harness-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Rust-native Anchor Agent execution boundary backed by io-harness and Rig"
publish = false

[dependencies]
anchor-runtime-rig = { path = "../anchor-runtime", features = ["rig-legacy"] }
base64 = "0.22"
io-harness = { version = "=0.86.0", features = ["media"] }
rig-core = { version = "=0.43.0", default-features = false }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }

[dev-dependencies]
rig-core = { version = "=0.43.0", default-features = false, features = ["test-utils"] }
tempfile = "3"
