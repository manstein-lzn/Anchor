[package]
name = "anchor-network-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native HTTP tools for the Anchor task networking Plugin"

[dependencies]
anchor-workspace-files = { path = "../anchor-workspace-files" }
rmcp = { workspace = true, features = ["server", "transport-io"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
rustix = { version = "=1.1.5", features = ["fs"] }
tempfile = "=3.27.0"
tokio = { workspace = true, features = ["io-std", "io-util", "net"] }

[dev-dependencies]
axum = "=0.8.9"
