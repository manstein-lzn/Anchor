[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anchor-agent-product"
version = "0.1.0.dev0"
description = "Vendor-neutral runtime foundation for long-running Agent products"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    # The agent loop and its model client. Ours is the graph, the workspace and the sandbox; the
    # loop is theirs (MIT), because a loop that cannot be stopped by talking is a property of the
    # loop and theirs has it. Pinned to the pair the migration was verified against (ADR-062); the
    # matrix is in DECISIONS.md and a change to it re-verifies.
    "pydantic-ai-slim==2.46.0",
    "pydantic-ai-harness==0.32.0",
    # The literature tools: fetching, and turning what comes back into text.
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
    "defusedxml>=0.7,<1",
    "lxml>=5,<7",
    "pypdf>=5,<7",
    "trafilatura>=1.12,<3",
]

[project.scripts]
anchor-scholarly = "anchor.scholarly.__main__:main"
anchor-graph = "anchor.simple.__main__:main"
anchor-done = "anchor.done.__main__:main"
anchor-route = "anchor.route.__main__:main"
anchor-serve = "anchor.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.16,<1",
    "mypy>=1.11,<3",
]
[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# Correctness and architecture rules only; style noise is out of scope.
select = ["E9", "F", "B023", "BLE", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "provider: makes one real model call; requires a configured runtime profile and its secret. Skips when the profile or the secret is absent, so a checkout without credentials still runs the suite.",
]
