[package]
name = "anchor-io-harness-spike"
version = "0.1.0"
edition = "2024"

[dependencies]
io-harness = { version = "=0.86.0", features = ["media"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "time"] }
tempfile = "3"

[[bin]]
name = "io-harness-live"
path = "src/bin/live.rs"
