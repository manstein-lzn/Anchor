  <g transform="translate(82 220)" fill="none" stroke="#285DE5" stroke-width="2.8">
    <rect x="0" y="0" width="37" height="58" rx="7"/><path d="M12 7 H25 M14 50 H23"/>
    <path d="M9 24 L16 31 L29 17"/>
