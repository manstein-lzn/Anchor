  <path d="M850 1165 H919" fill="none" stroke="#7CD2D0" stroke-width="2" marker-end="url(#arrow-light)"/>
  <text x="944" y="1155" class="subhead white">唤醒 Manager → 续派任务 / 协调 / 汇报</text>
  <text x="944" y="1193" class="small pale">复用现有编排能力，不另建一套调度器</text>

  <text x="52" y="1286" class="subhead blue">已有基础</text>
  <text x="52" y="1319" class="small muted">常驻 Graph · Codex 项目执行池 · 定时计划与结果回流</text>
  <text x="825" y="1286" class="subhead amber">本图规划</text>
  <text x="825" y="1319" class="small muted">群内 Bot @ Bot · 文档 / 多维表格 · 三级组织闭环</text>
  <path d="M52 1343 H1548" stroke="#D2DDE7"/>
  <text x="52" y="1373" class="small muted">当前飞书以获准私聊接入；群聊与文档联动需开发和验收。本地主机与 Bridge 在线，远程工作才能持续。</text>
  <text x="1548" y="1401" text-anchor="end" class="caption muted">2026-11-12 · 项目与目录为示意</text>
</svg>
