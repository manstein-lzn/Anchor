  <text x="1264" y="416" class="body muted">多维表格 + 云文档 / 知识库</text>
  <path d="M1202 454 H1238" class="shared"/>
  <path d="M1202 660 H1238" class="shared"/>
  <path d="M1202 932 H1238" class="shared"/>
  <text x="1264" y="484" class="subhead">多维表格 · 项目总览</text>
  <text x="1264" y="515" class="small muted">总 Manager 维护总览与模板</text>
  <path d="M1264 539 H1524" stroke="#E0E8EF"/>
