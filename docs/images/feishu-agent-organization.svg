  <path d="M252 1070 H287" class="down"/><text x="300" y="1076" class="small blue">目标 / 任务向下</text>
  <path d="M525 1070 H490" class="up"/><text x="540" y="1076" class="small teal">进度 / 阻塞 / 结果向上</text>
  <path d="M824 1070 H859" class="shared"/><text x="874" y="1076" class="small muted">文档与表格（规划）</text>

  <!-- Scheduling is a cross-cutting facility, not a fourth management level. -->
