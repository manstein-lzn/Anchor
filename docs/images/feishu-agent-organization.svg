  <text x="782" y="273" class="small muted">方案 / 进度 / 阻塞 / 验收</text>
  <text x="1212" y="237" class="subhead">不必逐个盯住会话</text>
  <text x="1212" y="273" class="small amber">群聊与按项目路由：待接入</text>

