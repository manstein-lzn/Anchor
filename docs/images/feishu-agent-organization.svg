  <text x="74" y="59" class="small blue" font-weight="700" letter-spacing="2">ANCHOR / 组织蓝图</text>
  <rect x="1270" y="30" width="278" height="37" rx="18" fill="#FFF2D8"/>
  <text x="1409" y="55" text-anchor="middle" class="small amber">目标架构 · 非上线清单</text>
  <text x="52" y="116" class="display">在飞书里，管理一整个 Agent 组织</text>
  <text x="52" y="154" class="body muted">说目标、看进度、做决策；项目的日常推进交给各级 Manager。</text>

