<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1420" viewBox="0 0 1600 1420" role="img" aria-labelledby="title desc">
  <title id="title">在飞书里，管理一整个 Agent 组织</title>
  <desc id="desc">目标架构：用户通过飞书组织群与总 Manager 沟通，也可通过项目群直接联系项目 Manager，各 Manager 通过 Bot @ Bot 协作。每个项目 Manager 是一个 Anchor 常驻 Graph，通过 Codex Plugin、Bridge 和本机 Codex 管理授权项目目录中的多个执行会话。任务逐级下达，进度、阻塞和结果逐级回流。总 Manager 维护统一文档库与多维表格模板，项目 Agent 更新获准的本项目文档和任务记录。Anchor Schedule 与 Graph Tasks 支持定时巡检和结果回流。当前飞书只支持授权私聊，群聊、云文档、多维表格和完整三级组织联动是规划，图中目录仅为示例。</desc>
  <defs>
    <style>
      text { font-family: 'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #17324D; }
      .display { font-size: 40px; font-weight: 800; letter-spacing: -1px; }
      .heading { font-size: 25px; font-weight: 700; }
      .subhead { font-size: 21px; font-weight: 700; }
      .body { font-size: 19px; }
      .small { font-size: 17px; }
      .caption { font-size: 15px; }
      .muted { fill: #52697D; }
      .white { fill: #FFFFFF; }
      .pale { fill: #C9DCEB; }
      .blue { fill: #285DE5; }
      .teal { fill: #087F8C; }
      .amber { fill: #9B6113; }
      .mono { font-family: 'DejaVu Sans Mono', monospace; font-size: 15px; }
      .tier { font-family: 'DejaVu Sans Mono', monospace; font-size: 31px; font-weight: 700; fill: #285DE5; }
      .down { fill: none; stroke: #285DE5; stroke-width: 2.5; marker-end: url(#arrow-blue); }
      .up { fill: none; stroke: #087F8C; stroke-width: 2.5; marker-end: url(#arrow-teal); }
      .shared { fill: none; stroke: #7F91A1; stroke-width: 2; stroke-dasharray: 4 4; marker-start: url(#arrow-gray); marker-end: url(#arrow-gray); }
      .planned { fill: none; stroke: #AD751E; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow-amber); }
      .project { fill: #FFFFFF; stroke: #C8D5E0; stroke-width: 1.5; }
      .task { fill: #F0F5FA; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#285DE5"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#087F8C"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7F91A1"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#AD751E"/></marker>
    <marker id="arrow-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7CD2D0"/></marker>
  </defs>

  <rect width="1600" height="1420" fill="#F7FAFC"/>
