name: CI

# Two jobs, because they answer different questions.
#
# `checks` is the fast one: the module graph, the quality ratchet, and the unit suite. It must
# stay runnable on every push.
#
# `end-to-end` runs the chain an agent host drives — author over MCP, admit, execute, verify,
# hold at a gate, approve, observe — with **no provider reachable**. That is possible only
# because the agent step is served from a checked-in recording, so this job needs no API key
# and cannot pass by accidentally reaching the network. It exists because every unit test can
# pass while the seam between them does not.
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: |
          uv venv
          uv pip install -e '.[dev]'
      - name: Quality ratchet
        # A metric may go down freely; any increase fails. The baseline is in the repository
        # so a change that adds complexity has to say so.
        run: .venv/bin/python scripts/quality_gate.py
      - name: Tests
        run: .venv/bin/pytest -q

  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: |
          uv venv
          uv pip install -e '.[dev]'
      - name: The chain, with no provider reachable
        # The agent step is served from tests/fixtures/replay/planner.json. The script starts
        # its own API against a temporary database, artifact root and runtime profile, and
        # hashes the fixture before and after so a check that mutated it would fail.
        run: .venv/bin/python scripts/ci_e2e.py
        env:
          # Deliberately empty: nothing here may reach a model provider, and leaving the
          # variable unset is what makes that a fact rather than an intention.
          ANCHOR_MCP_AGENT_CAN_APPROVE: ""
